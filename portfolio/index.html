    <script>
      /*
       * Undo the bounce from 404.html: turn "/?/aether" back into "/aether"
       * before the app mounts, so the router sees the path that was asked for.
       * A classic inline script runs ahead of the deferred module below.
       */
      (function (l) {
        if (l.search[1] !== '/') return;
        var path = l.search
          .slice(1)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&');
          })
          .join('?');
        history.replaceState(null, '', l.pathname.slice(0, -1) + path + l.hash);
      })(window.location);
    </script>
