<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eduardo Azuolas — Product Designer UX/UI</title>
    <meta name="description" content="Product Designer UX/UI based in São Paulo. Ten years designing physical and spatial products, now designing digital ones." />
    <meta name="theme-color" content="#080D13" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <script>
      /*
       * Undo the bounce from 404.html: turn "/?/aether" back into "/aether"
       * before the app mounts, so the router sees the path that was asked for.
       * A classic inline script runs ahead of the deferred module below.
       */
      (function (l) {
        if (l.search[1] !== '/') return;
        var path = l.search
          .slice(1)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&');
          })
          .join('?');
        history.replaceState(null, '', l.pathname.slice(0, -1) + path + l.hash);
      })(window.location);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
